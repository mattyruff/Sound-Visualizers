<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#060ce9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RETROPARDY! 1985&ndash;1995</title>
</head>
<body>
<style>
/* ═══════════════════════════════════════════════════════════
   RETROPARDY! — 1985–1995
   Classic game-show blue + gold, with a light CRT patina.
   No external assets. Everything works offline from file://.
   ═══════════════════════════════════════════════════════════ */

:root {
  --blue-deep:  #04053a;
  --blue-board: #060ce9;
  --blue-cell1: #0a10d8;
  --blue-cell2: #050a9e;
  --blue-clue:  #0b11c9;
  --gold:       #ffcc4d;
  --gold-deep:  #e0a020;
  --ink:        #ffffff;
  --good:       #2fe07c;
  --bad:        #ff5470;
  --pink:       #ff3ec8;
  --cyan:       #27e0ff;
  --font-value: "Haettenschweiler", "Impact", "Arial Narrow", sans-serif;
  --font-clue:  Georgia, "Times New Roman", serif;
  --font-ui:    "Verdana", "Geneva", sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  background: radial-gradient(120% 120% at 50% -10%, #10165e 0%, var(--blue-deep) 55%, #02021c 100%);
  color: var(--ink);
  font-family: var(--font-ui);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;          /* no double-tap zoom on rapid answer taps */
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right)
           env(safe-area-inset-bottom) env(safe-area-inset-left);
}

.hidden { display: none !important; }

.screen {
  min-height: 100vh;
  width: 100%;
  position: relative;
}

/* ── CRT patina ─────────────────────────────────────────── */
#scanlines {
  pointer-events: none;
  position: fixed; inset: 0; z-index: 90;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.11) 0 1px, transparent 1px 3px);
  mix-blend-mode: multiply;
}
#scanlines::after {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(115% 115% at 50% 50%, transparent 62%, rgba(0,0,10,.5) 100%);
}

/* ── Splash ─────────────────────────────────────────────── */
#splash, #results {
  display: flex; align-items: center; justify-content: center;
  text-align: center;
}

.splash-grid {
  position: absolute; inset: auto 0 0 0; height: 42vh;
  background:
    linear-gradient(to top, rgba(255,62,200,.28), transparent 70%),
    repeating-linear-gradient(90deg, rgba(39,224,255,.16) 0 1px, transparent 1px 72px),
    repeating-linear-gradient(0deg,  rgba(39,224,255,.16) 0 1px, transparent 1px 34px);
  transform: perspective(340px) rotateX(58deg);
  transform-origin: bottom;
  opacity: .8;
}

.splash-inner { position: relative; z-index: 2; padding: 48px 24px; max-width: 780px; }

.splash-kicker {
  font-size: 13px; letter-spacing: .5em; color: var(--cyan);
  text-transform: uppercase; margin-bottom: 18px;
}

.logo {
  font-family: var(--font-value);
  font-size: clamp(64px, 12vw, 128px);
  line-height: .92;
  letter-spacing: .02em;
  color: var(--gold);
  text-shadow:
    0 2px 0 var(--gold-deep),
    0 5px 0 #7a4d00,
    0 10px 24px rgba(0,0,0,.6);
}
.logo span { color: var(--ink); }
.small-logo { font-size: clamp(44px, 8vw, 84px); }

.splash-years {
  margin-top: 14px;
  font-family: var(--font-value);
  font-size: clamp(20px, 3.4vw, 30px);
  letter-spacing: .35em;
  color: var(--pink);
}

.splash-tag { margin-top: 12px; color: #aeb6ff; font-size: 14px; }

.player-pick { margin: 38px 0 8px; }
.pick-label { font-size: 11px; letter-spacing: .4em; color: #8f97e8; margin-bottom: 10px; }
.pick-btns { display: flex; gap: 12px; justify-content: center; }
.pick-btn {
  width: 58px; height: 58px;
  font-family: var(--font-value); font-size: 30px;
  color: var(--ink); background: var(--blue-cell2);
  border: 2px solid #3a42ff; border-radius: 10px;
  cursor: pointer; transition: transform .1s, background .15s, border-color .15s;
}
.pick-btn:hover { transform: translateY(-2px); }
.pick-btn.selected { background: var(--gold); color: #241500; border-color: var(--gold); }

.big-btn {
  margin-top: 26px;
  font-family: var(--font-value);
  font-size: 30px; letter-spacing: .08em;
  color: #241500; background: linear-gradient(180deg, #ffe28a, var(--gold) 55%, var(--gold-deep));
  border: none; border-radius: 12px;
  padding: 16px 44px; cursor: pointer;
  box-shadow: 0 6px 0 #8a5c00, 0 14px 30px rgba(0,0,0,.5);
  transition: transform .08s, box-shadow .08s;
}
.big-btn:hover  { transform: translateY(-2px); box-shadow: 0 8px 0 #8a5c00, 0 18px 34px rgba(0,0,0,.5); }
.big-btn:active { transform: translateY(3px);  box-shadow: 0 3px 0 #8a5c00, 0 8px 18px rgba(0,0,0,.5); }
.big-btn.small  { font-size: 22px; padding: 12px 34px; }

.splash-foot { margin-top: 34px; font-size: 12px; color: #7d85d8; display: flex; gap: 18px; justify-content: center; align-items: center; }
.link-btn { background: none; border: none; color: #7d85d8; text-decoration: underline; cursor: pointer; font-size: 12px; }
.link-btn:hover { color: var(--cyan); }

/* ── Top bar ────────────────────────────────────────────── */
#game { display: flex; flex-direction: column; height: 100vh; }

#topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px;
}
.topbar-logo { font-family: var(--font-value); font-size: 26px; color: var(--gold); letter-spacing: .03em; }
.topbar-logo span { color: var(--ink); }
#round-label { font-family: var(--font-value); font-size: 20px; letter-spacing: .3em; color: var(--cyan); }
#mute-btn {
  background: var(--blue-cell2); border: 1px solid #3a42ff; border-radius: 8px;
  font-size: 17px; padding: 6px 11px; cursor: pointer; color: var(--ink);
}

/* ── Board ──────────────────────────────────────────────── */
#board {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: minmax(64px, .9fr) repeat(5, 1fr);
  gap: 6px;
  padding: 4px 14px 10px;
  background: #010218;
  border-top: 3px solid #010218;
}

.cat-cell, .val-cell {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  min-width: 0; overflow: hidden;   /* let 1fr columns shrink on narrow screens */
  background: linear-gradient(180deg, var(--blue-cell1), var(--blue-cell2));
  border-radius: 4px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), inset 0 -6px 14px rgba(0,0,0,.35);
}

.cat-cell { padding: 6px 4px; }
.cat-title {
  font-family: var(--font-value);
  font-size: clamp(13px, 1.6vw, 21px);
  letter-spacing: .04em; line-height: 1.05;
  text-shadow: 0 2px 3px rgba(0,0,0,.8);
  max-width: 100%; overflow-wrap: anywhere;
}
.cat-sub { margin-top: 4px; font-size: clamp(8px, .85vw, 10px); letter-spacing: .18em; color: #9aa2ff; text-transform: uppercase; }

.val-cell {
  font-family: var(--font-value);
  font-size: clamp(26px, 3.6vw, 52px);
  color: var(--gold);
  text-shadow: 0 3px 0 rgba(0,0,0,.55);
  cursor: pointer; border: none;
  transition: transform .08s, filter .12s;
}
.val-cell:hover { filter: brightness(1.25); transform: scale(1.02); }
.val-cell.used  { color: transparent; text-shadow: none; cursor: default; background: linear-gradient(180deg, #05063c, #030428); }
.val-cell.used:hover { filter: none; transform: none; }

/* ── Score bar ──────────────────────────────────────────── */
#scorebar {
  display: flex; gap: 10px; justify-content: center;
  padding: 10px 14px 14px;
}
.podium-card {
  min-width: 170px; text-align: center;
  background: linear-gradient(180deg, #101563, #0a0d45);
  border: 2px solid #262fbf; border-radius: 10px;
  padding: 9px 16px 11px;
  transition: border-color .2s, box-shadow .2s;
}
.podium-card.active { border-color: var(--gold); box-shadow: 0 0 18px rgba(255,204,77,.35); }
.podium-name { font-size: 11px; letter-spacing: .25em; color: #9aa2ff; text-transform: uppercase; }
.podium-card.active .podium-name { color: var(--gold); }
.podium-score { font-family: var(--font-value); font-size: 30px; margin-top: 2px; }
.podium-score.neg { color: var(--bad); }

/* ── Clue overlay ───────────────────────────────────────── */
#clue, #wager {
  position: fixed; inset: 0; z-index: 50;
  background: radial-gradient(130% 130% at 50% 0%, #1219e0 0%, var(--blue-clue) 45%, #04053f 100%);
  display: flex; align-items: flex-start; justify-content: center;
  overflow-y: auto;                          /* long clues must scroll, never clip */
  -webkit-overflow-scrolling: touch;
  animation: clue-in .22s ease-out;
}
@keyframes clue-in { from { transform: scale(.35); opacity: .2; } to { transform: scale(1); opacity: 1; } }

.clue-inner {
  width: min(920px, 94vw); text-align: center;
  margin: auto;                              /* centers when short, scrolls when tall */
  padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
}

.clue-head {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--font-value); letter-spacing: .1em;
  border-bottom: 2px solid rgba(255,255,255,.25); padding-bottom: 10px; margin-bottom: 26px;
}
#clue-cat   { font-size: clamp(18px, 2.6vw, 28px); }
#clue-value { font-size: clamp(22px, 3vw, 34px); color: var(--gold); }

#dd-flash {
  font-family: var(--font-value);
  font-size: clamp(40px, 7vw, 76px);
  color: var(--pink);
  text-shadow: 0 0 26px rgba(255,62,200,.8), 0 4px 0 rgba(0,0,0,.5);
  animation: dd-pulse .55s ease-in-out infinite alternate;
  margin-bottom: 18px;
}
@keyframes dd-pulse { from { transform: scale(1); } to { transform: scale(1.07); } }

.clue-player { font-size: 12px; letter-spacing: .35em; color: var(--cyan); text-transform: uppercase; margin-bottom: 14px; }

#clue-q {
  font-family: var(--font-clue);
  font-size: clamp(21px, 3.1vw, 34px);
  font-weight: bold;
  text-transform: uppercase;
  line-height: 1.35;
  text-shadow: 2px 2px 2px rgba(0,0,0,.85);
  min-height: 3em;
  margin-bottom: 30px;
}

#clue-answers { display: grid; gap: 12px; max-width: 640px; margin: 0 auto; }
.ans-btn {
  display: flex; align-items: center; gap: 14px; text-align: left;
  font-family: var(--font-ui); font-size: clamp(15px, 1.9vw, 19px);
  color: var(--ink); background: rgba(0,0,40,.42);
  border: 2px solid rgba(154,162,255,.5); border-radius: 10px;
  padding: 13px 18px; cursor: pointer;
  transition: background .12s, border-color .12s, transform .08s;
}
.ans-btn:hover { background: rgba(20,26,120,.75); border-color: var(--cyan); transform: translateX(4px); }
.ans-key {
  font-family: var(--font-value); font-size: 20px; color: var(--gold);
  border: 1px solid rgba(255,204,77,.6); border-radius: 6px;
  width: 32px; height: 32px; line-height: 30px; text-align: center; flex: none;
}
.ans-btn.reveal-good { background: rgba(17,84,48,.9); border-color: var(--good); }
.ans-btn.reveal-bad  { background: rgba(96,18,34,.9); border-color: var(--bad); opacity: .95; }
.ans-btn.dim { opacity: .35; }
.ans-btn:disabled { cursor: default; transform: none; }

#timer { height: 7px; background: rgba(0,0,30,.6); border-radius: 4px; margin-top: 26px; overflow: hidden; }
#timer-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--cyan), var(--pink)); border-radius: 4px; }

#verdict { margin-top: 22px; }
#verdict-text {
  font-family: var(--font-value);
  font-size: clamp(26px, 4vw, 40px);
  letter-spacing: .06em;
  margin-bottom: 6px;
}
#verdict-text.good { color: var(--good); text-shadow: 0 0 20px rgba(47,224,124,.5); }
#verdict-text.bad  { color: var(--bad);  text-shadow: 0 0 20px rgba(255,84,112,.5); }

/* ── Final wager ────────────────────────────────────────── */
.final-title {
  font-family: var(--font-value);
  font-size: clamp(34px, 6vw, 64px);
  color: var(--gold);
  text-shadow: 0 3px 0 var(--gold-deep), 0 8px 20px rgba(0,0,0,.6);
  margin-bottom: 10px;
}
.final-cat { font-family: var(--font-value); font-size: clamp(20px, 3vw, 30px); letter-spacing: .12em; color: var(--cyan); margin-bottom: 26px; }

.wager-row { display: flex; align-items: center; gap: 22px; max-width: 560px; margin: 0 auto 8px; }
#wager-slider { flex: 1; accent-color: var(--gold); height: 30px; cursor: pointer; }
#wager-amt { font-family: var(--font-value); font-size: 40px; color: var(--gold); min-width: 130px; text-align: right; }

/* ── Results ────────────────────────────────────────────── */
#podium { display: flex; gap: 14px; justify-content: center; margin: 30px 0 8px; flex-wrap: wrap; }
#podium .podium-card { padding: 16px 26px; }
#podium .winner { border-color: var(--gold); box-shadow: 0 0 24px rgba(255,204,77,.45); }
#podium .winner .podium-name::after { content: " 🏆"; }
.fun-fact { margin-top: 18px; color: #aeb6ff; font-size: 13px; max-width: 540px; margin-left: auto; margin-right: auto; line-height: 1.6; }

/* ── Small screens ──────────────────────────────────────── */
@media (max-width: 640px) {
  #board { gap: 3px; padding: 3px 6px 6px; }
  #topbar { padding: 8px 10px; }
  .topbar-logo { font-size: 18px; }
  #round-label { font-size: 13px; letter-spacing: .15em; }
  #mute-btn { font-size: 13px; padding: 4px 8px; }
  .cat-title { font-size: 10px; letter-spacing: .02em; }
  .cat-sub { display: none; }
  .val-cell { font-size: clamp(15px, 5.4vw, 30px); }
  .podium-card { min-width: 100px; padding: 6px 10px 8px; }
  .podium-score { font-size: 22px; }
  .clue-head { flex-direction: column; gap: 4px; align-items: center; margin-bottom: 14px; }
  .clue-inner { padding-top: 14px; }
  #clue-q { min-height: 0; margin-bottom: 16px; }
  #clue-answers { gap: 9px; }
  .ans-btn { padding: 11px 13px; gap: 10px; }
  #timer { margin-top: 14px; }
  #verdict { margin-top: 12px; }
  #dd-flash { margin-bottom: 8px; }
}

</style>
<!-- ══════════ SPLASH ══════════ -->
<section id="splash" class="screen">
  <div class="splash-grid"></div>
  <div class="splash-inner">
    <div class="splash-kicker">DIRECT FROM THE VIDEO VAULT</div>
    <h1 class="logo">RETRO<span>PARDY!</span></h1>
    <div class="splash-years">&#9733; 1985 &ndash; 1995 &#9733;</div>
    <p class="splash-tag">Movies &middot; Music &middot; Video Games &middot; World Events &middot; Cars &middot; Snacks &amp; more</p>

    <div class="player-pick">
      <div class="pick-label">CONTESTANTS</div>
      <div class="pick-btns">
        <button class="pick-btn selected" data-n="1">1</button>
        <button class="pick-btn" data-n="2">2</button>
        <button class="pick-btn" data-n="3">3</button>
      </div>
    </div>

    <button id="start-btn" class="big-btn">START THE GAME</button>
    <div class="splash-foot">
      <span id="bank-count"></span>
      <button id="reset-seen" class="link-btn" title="Forget which questions you've already been asked">reset question history</button>
    </div>
  </div>
</section>

<!-- ══════════ GAME ══════════ -->
<section id="game" class="screen hidden">
  <header id="topbar">
    <div class="topbar-logo">RETRO<span>PARDY!</span></div>
    <div id="round-label">ROUND 1</div>
    <button id="mute-btn" title="Sound on/off">&#128266;</button>
  </header>

  <div id="board"></div>

  <footer id="scorebar"></footer>
</section>

<!-- ══════════ CLUE OVERLAY ══════════ -->
<section id="clue" class="screen hidden">
  <div class="clue-inner">
    <div class="clue-head">
      <span id="clue-cat"></span>
      <span id="clue-value"></span>
    </div>
    <div id="dd-flash" class="hidden">DAILY&nbsp;DOUBLE!</div>
    <div id="clue-player" class="clue-player"></div>
    <p id="clue-q"></p>
    <div id="clue-answers"></div>
    <div id="timer"><div id="timer-fill"></div></div>
    <div id="verdict" class="hidden">
      <div id="verdict-text"></div>
      <button id="continue-btn" class="big-btn small">CONTINUE</button>
    </div>
  </div>
</section>

<!-- ══════════ WAGER (FINAL) ══════════ -->
<section id="wager" class="screen hidden">
  <div class="clue-inner">
    <div class="final-title">FINAL RETROPARDY!</div>
    <div id="wager-cat" class="final-cat"></div>
    <div id="wager-player" class="clue-player"></div>
    <div class="wager-row">
      <input type="range" id="wager-slider" min="0" max="1000" step="100" value="0">
      <div id="wager-amt">$0</div>
    </div>
    <button id="wager-btn" class="big-btn small">LOCK IT IN</button>
  </div>
</section>

<!-- ══════════ RESULTS ══════════ -->
<section id="results" class="screen hidden">
  <div class="splash-grid"></div>
  <div class="splash-inner">
    <div class="splash-kicker">FINAL SCORES</div>
    <h1 class="logo small-logo">THAT'S A WRAP</h1>
    <div id="podium"></div>
    <div id="fun-fact" class="fun-fact"></div>
    <button id="again-btn" class="big-btn">PLAY AGAIN</button>
  </div>
</section>

<div id="scanlines"></div>

/* ═══════════════════════════════════════════════════════════
   RETROPARDY! — game engine
   Two rounds of 6×5 clues + a Final wager round.
   Questions come from window.RETRO_BANK (js/data/*.js).
   Question history persists in localStorage so replays draw
   fresh material until the pool runs dry.
   ═══════════════════════════════════════════════════════════ */
(function () {
"use strict";

/* ── category flavor ────────────────────────────────────── */
var CAT_META = {
  "Movies":         { title: "AT THE MOVIES",    sub: "Movies" },
  "Television":     { title: "TUBE TIME",        sub: "Television" },
  "Music":          { title: "MIXTAPE",          sub: "Music" },
  "Video Games":    { title: "HIGH SCORES",      sub: "Video Games" },
  "Sports":         { title: "SPORTS PAGE",      sub: "Sports" },
  "World Events":   { title: "HEADLINES",        sub: "World Events" },
  "Food & Drink":   { title: "DRIVE-THRU",       sub: "Food & Drink" },
  "Cars":           { title: "HORSEPOWER",       sub: "Cars" },
  "Tech & Toys":    { title: "GADGETS & GIZMOS", sub: "Tech & Toys" },
  "Fads & Fashion": { title: "TOTALLY RAD",      sub: "Fads & Fashion" }
};

var FUN_FACTS = [
  "In 1985 a top-loading NES cost $89.99 and came with R.O.B. the robot.",
  "Blockbuster opened its first store in Dallas in October 1985.",
  "The final brick of the Berlin Wall era fell just weeks after 'Girl You Know It's True' went platinum. Coincidence?",
  "A 1989 Game Boy ran about 30 hours on 4 AA batteries. Your phone wishes.",
  "MTV still played music videos for most of this game's era. Really.",
  "In 1995, a 28.8k modem was considered blazing fast.",
  "Crystal Pepsi lasted about a year. This game will last longer.",
  "The Macarena hit the US in 1995 — technically eligible, unfortunately.",
  "Thanks for playing. Be kind, rewind."
];

var ROUND_VALUES = { 1: [200, 400, 600, 800, 1000], 2: [400, 800, 1200, 1600, 2000] };
var TIMER_SECONDS = 20;
var SEEN_KEY = "retropardy_seen_v1";
var MUTE_KEY = "retropardy_mute_v1";

/* ── question bank ──────────────────────────────────────── */
var BANK = (window.RETRO_BANK || []).filter(function (q) {
  return q && q.q && q.c && q.c.length === 3 && q.a >= 0 && q.a <= 2 && CAT_META[q.cat];
});

function qid(q) { // stable id: djb2 hash of the question text
  var h = 5381, s = q.q;
  for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}

var byCatDiff = {}; // cat -> diff -> [q]
BANK.forEach(function (q) {
  q.id = qid(q);
  (byCatDiff[q.cat] = byCatDiff[q.cat] || {})[q.d] = (byCatDiff[q.cat][q.d] || []).concat([q]);
});

var seen = loadSeen();
function loadSeen() {
  try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || "[]")); }
  catch (e) { return new Set(); }
}
function saveSeen() {
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(Array.from(seen))); } catch (e) {}
}

/* ── audio: tiny synth, no assets ───────────────────────── */
var muted = false;
try { muted = localStorage.getItem(MUTE_KEY) === "1"; } catch (e) {}
var actx = null;
function ac() {
  if (!actx) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function tone(freq, t0, dur, type, gain) {
  var ctx = ac(); if (!ctx || muted) return;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || "square"; o.frequency.value = freq;
  var at = ctx.currentTime + (t0 || 0);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(gain || 0.08, at + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(at); o.stop(at + dur + 0.05);
}
var sfx = {
  pick:    function () { tone(660, 0, 0.09, "square", 0.05); },
  reveal:  function () { tone(392, 0, 0.1, "triangle", 0.06); tone(523, 0.07, 0.12, "triangle", 0.06); },
  correct: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.09, 0.16, "triangle", 0.09); }); },
  wrong:   function () { tone(196, 0, 0.28, "sawtooth", 0.07); tone(147, 0.22, 0.42, "sawtooth", 0.07); },
  dd:      function () { [330, 440, 554, 660, 880].forEach(function (f, i) { tone(f, i * 0.07, 0.14, "square", 0.07); }); },
  tick:    function () { tone(880, 0, 0.03, "square", 0.02); },
  fanfare: function () { [523, 523, 523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.12, 0.2, "triangle", 0.1); }); }
};

/* ── state ──────────────────────────────────────────────── */
var S = {
  nPlayers: 1,
  players: [],           // {name, score, wager, finalDone}
  control: 0,            // index of player in control
  round: 1,
  cells: [],             // 30 cell objects: {q, value, dd, used}
  cats: [],              // 6 cat keys for this round
  remaining: 0,
  gameUsed: new Set(),   // question ids used this game
  current: null,         // active cell
  timerId: null,
  finalQ: null,
  finalPhase: 0          // index of player wagering / answering
};

/* ── dom helpers ────────────────────────────────────────── */
function $(id) { return document.getElementById(id); }
function show(id) { $(id).classList.remove("hidden"); }
function hide(id) { $(id).classList.add("hidden"); }
function money(n) { return (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString(); }
function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)), t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/* ── question picking ───────────────────────────────────── */
function pickQuestion(cat, d) {
  var pool = (byCatDiff[cat] && byCatDiff[cat][d]) || [];
  var fresh = pool.filter(function (q) { return !seen.has(q.id) && !S.gameUsed.has(q.id); });
  if (!fresh.length) fresh = pool.filter(function (q) { return !S.gameUsed.has(q.id); });
  if (!fresh.length) fresh = pool;
  if (!fresh.length) return null;
  var q = fresh[Math.floor(Math.random() * fresh.length)];
  S.gameUsed.add(q.id);
  return q;
}

function catsWithFreshCount() {
  return Object.keys(byCatDiff).map(function (cat) {
    var fresh = 0;
    for (var d = 1; d <= 5; d++) {
      ((byCatDiff[cat][d]) || []).forEach(function (q) { if (!seen.has(q.id)) fresh++; });
    }
    return { cat: cat, fresh: fresh };
  });
}

function pickCats(exclude) {
  // favor categories with the most unseen material; light shuffle for variety
  var all = catsWithFreshCount();
  var scored = all.filter(function (c) { return exclude.indexOf(c.cat) === -1; });
  shuffle(scored);
  scored.sort(function (a, b) { return b.fresh - a.fresh; });
  var top = scored.slice(0, 8);
  shuffle(top);
  var picked = top.slice(0, 6).map(function (c) { return c.cat; });
  if (picked.length < 6) { // not enough unused categories — repeat some from last round
    var fill = shuffle(all.filter(function (c) { return picked.indexOf(c.cat) === -1; }));
    while (picked.length < 6 && fill.length) picked.push(fill.shift().cat);
  }
  return picked;
}

/* ── board ──────────────────────────────────────────────── */
function buildRound(round) {
  S.round = round;
  S.cats = pickCats(round === 2 ? S.cats : []);
  S.cells = [];
  var values = ROUND_VALUES[round];
  S.cats.forEach(function (cat, ci) {
    values.forEach(function (v, ri) {
      S.cells.push({ cat: cat, q: pickQuestion(cat, ri + 1), value: v, dd: false, used: false, ci: ci, ri: ri });
    });
  });
  // daily doubles: 1 in round one, 2 in round two — never on the top row
  var eligible = S.cells.filter(function (c) { return c.ri > 0 && c.q; });
  shuffle(eligible).slice(0, round === 1 ? 1 : 2).forEach(function (c) { c.dd = true; });
  S.remaining = S.cells.filter(function (c) { return c.q; }).length;
  renderBoard();
  $("round-label").textContent = round === 1 ? "ROUND 1" : "DOUBLE ROUND";
  sfx.reveal();
}

function renderBoard() {
  var board = $("board");
  board.innerHTML = "";
  S.cats.forEach(function (cat) {
    var meta = CAT_META[cat];
    var el = document.createElement("div");
    el.className = "cat-cell";
    el.innerHTML = '<div class="cat-title">' + meta.title + '</div><div class="cat-sub">' + meta.sub + "</div>";
    board.appendChild(el);
  });
  for (var ri = 0; ri < 5; ri++) {
    for (var ci = 0; ci < 6; ci++) {
      (function (cell) {
        var b = document.createElement("button");
        b.className = "val-cell";
        if (!cell.q || cell.used) {
          b.classList.add("used");
          b.disabled = true;
          b.textContent = "$" + cell.value;
        } else {
          b.textContent = "$" + cell.value;
          b.addEventListener("click", function () { openClue(cell, b); });
        }
        board.appendChild(b);
      })(S.cells[ci * 5 + ri]);
    }
  }
  renderScores("scorebar");
}

function renderScores(elId) {
  var bar = $(elId);
  bar.innerHTML = "";
  S.players.forEach(function (p, i) {
    var d = document.createElement("div");
    d.className = "podium-card" + (i === S.control && S.nPlayers > 1 ? " active" : "");
    d.innerHTML = '<div class="podium-name">' + p.name + '</div>' +
                  '<div class="podium-score' + (p.score < 0 ? " neg" : "") + '">' + money(p.score) + "</div>";
    bar.appendChild(d);
  });
}

/* ── clue flow ──────────────────────────────────────────── */
function openClue(cell, btn) {
  sfx.pick();
  S.current = cell;
  cell.used = true;
  btn.classList.add("used");
  btn.disabled = true;
  seen.add(cell.q.id); saveSeen();

  var value = cell.dd ? cell.value * 2 : cell.value;
  $("clue-cat").textContent = CAT_META[cell.cat].title;
  $("clue-value").textContent = money(value);
  $("clue-player").textContent = S.nPlayers > 1 ? S.players[S.control].name + " HAS THE BOARD" : "";
  $("clue-q").textContent = cell.q.q;
  hide("verdict");
  $("timer").style.visibility = "visible";

  if (cell.dd) { show("dd-flash"); sfx.dd(); } else { hide("dd-flash"); }

  renderAnswers(cell.q, value, function (okay, pickedIdx, timedOut) {
    resolveClue(cell, value, okay, timedOut);
  });
  show("clue");
  startTimer(function () { finishAnswer(null, true); });
}

var finishAnswer = function () {}; // rebound per clue

function renderAnswers(q, value, done) {
  var wrap = $("clue-answers");
  wrap.innerHTML = "";
  var order = shuffle([0, 1, 2]);
  var buttons = [];
  var settled = false;

  finishAnswer = function (pickedIdx, timedOut) {
    if (settled) return;
    settled = true;
    stopTimer();
    var okay = pickedIdx !== null && order[pickedIdx] === q.a;
    buttons.forEach(function (b, i) {
      b.disabled = true;
      if (order[i] === q.a) b.classList.add("reveal-good");
      else if (i === pickedIdx) b.classList.add("reveal-bad");
      else b.classList.add("dim");
    });
    done(okay, pickedIdx, !!timedOut);
  };

  order.forEach(function (srcIdx, i) {
    var b = document.createElement("button");
    b.className = "ans-btn";
    b.innerHTML = '<span class="ans-key">' + (i + 1) + "</span><span>" + escapeHtml(q.c[srcIdx]) + "</span>";
    b.addEventListener("click", function () { finishAnswer(i, false); });
    wrap.appendChild(b);
    buttons.push(b);
  });
}

function resolveClue(cell, value, okay, timedOut) {
  var p = S.players[S.control];
  var vt = $("verdict-text");
  if (okay) {
    p.score += value;
    vt.textContent = pick(["RIGHT ON!", "TUBULAR!", "MOST EXCELLENT!", "BODACIOUS!", "NO DOUBT!"]) + "  +" + money(value).slice(1);
    vt.className = "good";
    sfx.correct();
  } else if (timedOut) {
    vt.textContent = "TIME'S UP!";
    vt.className = "bad";
    sfx.wrong();
    if (S.nPlayers > 1) S.control = (S.control + 1) % S.nPlayers;
  } else {
    p.score -= value;
    vt.textContent = pick(["BOGUS!", "NOT EVEN!", "AS IF!", "GNARLY MISS!"]) + "  -" + money(value).slice(1);
    vt.className = "bad";
    sfx.wrong();
    if (S.nPlayers > 1) S.control = (S.control + 1) % S.nPlayers;
  }
  $("timer").style.visibility = "hidden";
  show("verdict");
  revealContinue();
}

function revealContinue() {
  var b = $("continue-btn");
  function bring() { b.scrollIntoView({ block: "nearest" }); }
  requestAnimationFrame(function () {
    b.focus({ preventScroll: true });
    bring();
    setTimeout(bring, 300); // again once any pending layout/animation settles
  });
}

function closeClue() {
  hide("clue");
  S.remaining--;
  renderBoard();
  if (S.remaining <= 0) {
    if (S.round === 1) buildRound(2);
    else startFinal();
  }
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ── timer ──────────────────────────────────────────────── */
function startTimer(onExpire) {
  stopTimer();
  var fill = $("timer-fill");
  var start = Date.now(), total = TIMER_SECONDS * 1000, lastTick = 0;
  fill.style.width = "100%";
  S.timerId = setInterval(function () {
    var left = total - (Date.now() - start);
    if (left <= 0) { stopTimer(); fill.style.width = "0%"; onExpire(); return; }
    fill.style.width = (left / total * 100) + "%";
    if (left < 5200) { // audible countdown in the last five seconds
      var sec = Math.ceil(left / 1000);
      if (sec !== lastTick) { lastTick = sec; sfx.tick(); }
    }
  }, 80);
}
function stopTimer() { if (S.timerId) { clearInterval(S.timerId); S.timerId = null; } }

/* ── final round ────────────────────────────────────────── */
function startFinal() {
  // hardest unseen question from the category with the most fresh material
  var cats = shuffle(Object.keys(byCatDiff));
  S.finalQ = null;
  for (var i = 0; i < cats.length && !S.finalQ; i++) S.finalQ = pickQuestion(cats[i], 5);
  if (!S.finalQ) { endGame(); return; }
  seen.add(S.finalQ.id); saveSeen();
  S.finalPhase = 0;
  S.players.forEach(function (p) { p.wager = 0; p.finalDone = false; });
  askWager();
}

function askWager() {
  var p = S.players[S.finalPhase];
  var max = Math.max(p.score, 1000);
  $("wager-cat").textContent = "CATEGORY: " + CAT_META[S.finalQ.cat].title;
  $("wager-player").textContent = p.name + " — SET YOUR WAGER";
  var slider = $("wager-slider");
  slider.max = max;
  slider.step = 100;
  slider.value = Math.min(Math.max(Math.round(max / 2 / 100) * 100, 0), max);
  $("wager-amt").textContent = money(+slider.value);
  hide("game"); show("wager");
}

function lockWager() {
  S.players[S.finalPhase].wager = +$("wager-slider").value;
  sfx.pick();
  S.finalPhase++;
  if (S.finalPhase < S.nPlayers) { askWager(); return; }
  hide("wager");
  S.finalPhase = 0;
  askFinalAnswer();
}

function askFinalAnswer() {
  var p = S.players[S.finalPhase];
  $("clue-cat").textContent = "FINAL: " + CAT_META[S.finalQ.cat].title;
  $("clue-value").textContent = "WAGER " + money(p.wager);
  $("clue-player").textContent = S.nPlayers > 1 ? p.name + " ANSWERS" : "";
  $("clue-q").textContent = S.finalQ.q;
  hide("dd-flash"); hide("verdict");
  $("timer").style.visibility = "visible";

  renderAnswers(S.finalQ, p.wager, function (okay) {
    p.score += okay ? p.wager : -p.wager;
    var vt = $("verdict-text");
    vt.textContent = okay ? "CORRECT!  +" + money(p.wager).slice(1) : "WRONG!  -" + money(p.wager).slice(1);
    vt.className = okay ? "good" : "bad";
    if (okay) sfx.correct(); else sfx.wrong();
    $("timer").style.visibility = "hidden";
    show("verdict");
    revealContinue();
  });
  show("clue");
  startTimer(function () { finishAnswer(null, true); });
}

function continueFromVerdict() {
  if (S.finalQ) {
    hide("clue");
    S.finalPhase++;
    if (S.finalPhase < S.nPlayers) askFinalAnswer();
    else endGame();
  } else {
    closeClue();
  }
}

function endGame() {
  hide("clue"); hide("game"); hide("wager");
  var podium = $("podium");
  podium.innerHTML = "";
  var best = Math.max.apply(null, S.players.map(function (p) { return p.score; }));
  S.players.forEach(function (p) {
    var d = document.createElement("div");
    d.className = "podium-card" + (p.score === best ? " winner" : "");
    d.innerHTML = '<div class="podium-name">' + p.name + '</div>' +
                  '<div class="podium-score' + (p.score < 0 ? " neg" : "") + '">' + money(p.score) + "</div>";
    podium.appendChild(d);
  });
  $("fun-fact").textContent = pick(FUN_FACTS);
  show("results");
  sfx.fanfare();
}

/* ── game setup ─────────────────────────────────────────── */
function newGame() {
  var names = ["PLAYER ONE", "PLAYER TWO", "PLAYER THREE"];
  S.players = [];
  for (var i = 0; i < S.nPlayers; i++) S.players.push({ name: names[i], score: 0, wager: 0 });
  S.control = 0;
  S.gameUsed = new Set();
  S.finalQ = null;
  hide("splash"); hide("results"); show("game");
  buildRound(1);
}

/* ── wiring ─────────────────────────────────────────────── */
document.addEventListener("DOMContentLoaded", function () {
  var unseenCount = BANK.filter(function (q) { return !seen.has(q.id); }).length;
  $("bank-count").textContent = BANK.length.toLocaleString() + " questions loaded · " + unseenCount.toLocaleString() + " you haven't seen";

  Array.prototype.forEach.call(document.querySelectorAll(".pick-btn"), function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll(".pick-btn").forEach(function (x) { x.classList.remove("selected"); });
      b.classList.add("selected");
      S.nPlayers = +b.dataset.n;
      sfx.pick();
    });
  });

  $("start-btn").addEventListener("click", function () { ac(); sfx.reveal(); newGame(); });
  $("again-btn").addEventListener("click", function () { newGame(); });
  $("continue-btn").addEventListener("click", continueFromVerdict);
  $("wager-btn").addEventListener("click", lockWager);
  $("wager-slider").addEventListener("input", function () { $("wager-amt").textContent = money(+this.value); });

  $("reset-seen").addEventListener("click", function () {
    seen = new Set(); saveSeen();
    $("bank-count").textContent = BANK.length.toLocaleString() + " questions loaded · all fresh again";
  });

  var muteBtn = $("mute-btn");
  function paintMute() { muteBtn.textContent = muted ? "🔇" : "🔊"; }
  paintMute();
  muteBtn.addEventListener("click", function () {
    muted = !muted;
    try { localStorage.setItem(MUTE_KEY, muted ? "1" : "0"); } catch (e) {}
    paintMute();
  });

  // keys 1/2/3 answer, Enter continues
  document.addEventListener("keydown", function (e) {
    if (!$("clue").classList.contains("hidden")) {
      if (e.key >= "1" && e.key <= "3" && $("verdict").classList.contains("hidden")) {
        finishAnswer(+e.key - 1, false);
      } else if (e.key === "Enter" && !$("verdict").classList.contains("hidden")) {
        continueFromVerdict();
      }
    }
  });
});

})();

// Inline bundle: if the DOM is already parsed when this runs, fire init manually.
if (document.readyState !== "loading") {
  document.dispatchEvent(new Event("DOMContentLoaded"));
}
</script>
</body>
