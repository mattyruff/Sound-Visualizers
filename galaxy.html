<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><circle cx=%2232%22 cy=%2232%22 r=%2226%22 fill=%22none%22 stroke=%22%23f5c542%22 stroke-width=%224%22/><circle cx=%2232%22 cy=%2232%22 r=%2210%22 fill=%22%23f5c542%22/></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Galaxy — Spiral</title>
<style>
  :root{
    --void:#040308; --ink:#d9d3e9; --muted:#6f688a;
    --gold:#f5c542; --gold-pale:#ffe9a8; --gold-deep:#7a5a18;
    --line:rgba(245,197,66,.20); --glass:rgba(9,7,16,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--void);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;-webkit-font-smoothing:antialiased}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  #veil{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1.5rem;background:radial-gradient(120% 90% at 50% 42%,#0d081f40 0%,#040308 72%);z-index:30;transition:opacity .6s ease}
  #veil.gone{opacity:0;pointer-events:none}
  #veil h1{font-weight:300;font-size:1.5rem;letter-spacing:.42em;text-transform:uppercase;
    color:var(--gold-pale);padding-left:.42em}
  #veil p{color:var(--muted);font-size:.84rem;letter-spacing:.05em;max-width:33ch;text-align:center;line-height:1.8}
  .cta{display:flex;gap:.7rem;margin-top:.3rem;flex-wrap:wrap;justify-content:center}
  button.b{appearance:none;border:1px solid var(--gold-deep);background:transparent;color:var(--gold);
    font:inherit;font-size:.78rem;letter-spacing:.1em;padding:.62rem 1.3rem;border-radius:999px;cursor:pointer;
    transition:.18s;text-transform:uppercase}
  button.b:hover{border-color:var(--gold);background:rgba(245,197,66,.08);color:var(--gold-pale)}
  button.b.solid{background:var(--gold);color:#1a1206;border-color:var(--gold)}
  button.b.solid:hover{background:var(--gold-pale)}

  #dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;
    padding:10px 16px;background:var(--glass);border:1px solid var(--line);border-radius:16px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:20;transition:opacity .4s ease;max-width:94vw}
  #dock.hide{opacity:0;pointer-events:none}
  .ic{width:40px;height:40px;border-radius:11px;border:1px solid transparent;background:transparent;color:var(--ink);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .ic:hover{background:rgba(245,197,66,.1);border-color:var(--line)}
  .ic.active{color:var(--gold);border-color:var(--gold-deep);background:rgba(245,197,66,.08)}
  .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .sep{width:1px;height:26px;background:var(--line)}
  .ctl{display:flex;align-items:center;gap:8px}
  .ctl label{font-size:.64rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
  input[type=range]{-webkit-appearance:none;width:76px;height:3px;border-radius:3px;background:var(--gold-deep);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--gold);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--gold);cursor:pointer}

  #hud{position:fixed;top:18px;left:18px;z-index:20;font-size:.68rem;letter-spacing:.12em;color:var(--muted);
    line-height:2;text-transform:uppercase;transition:opacity .4s ease}
  #hud.hide{opacity:0}
  #hud b{color:var(--gold);font-weight:400}
  #hud .meter{width:120px;height:2px;background:rgba(245,197,66,.16);margin-top:7px;overflow:hidden}
  #hud .meter i{display:block;height:100%;width:0;background:var(--gold)}

  #nav{position:fixed;top:16px;right:16px;z-index:40;display:flex;align-items:center;gap:3px;padding:5px;
    background:var(--glass);border:1px solid var(--line);border-radius:12px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:opacity .4s ease}
  #nav.hide{opacity:0;pointer-events:none}
  #nav a{font:inherit;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;
    color:var(--muted);padding:.42rem .8rem;border-radius:8px;transition:.15s}
  #nav a:hover{color:var(--gold-pale);background:rgba(245,197,66,.08)}
  #nav a.active{color:var(--gold);background:rgba(245,197,66,.12)}
  #nav a.home{font-size:1rem;line-height:1;padding:.35rem .58rem;color:var(--gold)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="nav">
  <a href="index.html" class="home" title="Menu" aria-label="Menu">≡</a>
  <a href="aurum.html">Aurum</a>
  <a href="torus.html">Torus</a>
  <a href="galaxy.html" class="active">Galaxy</a>
</div>

<div id="hud" class="hide">
  <div>spiral galaxy</div>
  <div>stars <b id="hStars">—</b></div>
  <div>centroid <b id="hHz">—</b></div>
  <div class="meter"><i id="hLvl"></i></div>
</div>

<div id="veil">
  <h1>Galaxy</h1>
  <p>A spiral galaxy that sparkles with your gong — stars glittering on every shimmer, the core flaring with each strike. Load a recording, or play live.</p>
  <div class="cta">
    <button class="b solid" id="vSample">Play sample gong</button>
    <button class="b" id="vFile">Load audio</button>
    <button class="b" id="vMic">Use live mic</button>
  </div>
  <p style="font-size:.7rem;opacity:.7">or drop an audio file anywhere</p>
</div>

<div id="dock" class="hide">
  <button class="ic" id="dPlay" title="Play / pause" aria-label="Play or pause">
    <svg viewBox="0 0 24 24"><path id="dPlayIcon" d="M8 5v14l11-7z"/></svg>
  </button>
  <button class="ic" id="dFile" title="Load audio file" aria-label="Load audio file">
    <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M9 9l3 3 3-3"/><path d="M12 12V5"/></svg>
  </button>
  <button class="ic" id="dMic" title="Live microphone" aria-label="Live microphone">
    <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
  </button>
  <button class="ic" id="dSample" title="Sample gong" aria-label="Sample gong">
    <svg viewBox="0 0 24 24"><path d="M4 4l3 2m13-2l-3 2"/><circle cx="12" cy="13" r="8"/><circle cx="12" cy="13" r="3"/></svg>
  </button>
  <div class="sep"></div>
  <div class="ctl"><label>React</label><input type="range" id="react" min="0.3" max="2.5" step="0.05" value="1.1"></div>
  <div class="ctl"><label>Sparkle</label><input type="range" id="sparkle" min="0.2" max="3" step="0.05" value="1"></div>
  <div class="ctl"><label>Spin</label><input type="range" id="spin" min="0" max="2" step="0.05" value="1"></div>
  <div class="sep"></div>
  <button class="ic" id="dFull" title="Fullscreen" aria-label="Fullscreen">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>
  </button>
</div>

<input type="file" id="filePick" accept="audio/*,.m4a,.aac,.mp3,.wav,.caf,.aiff" hidden>

<script>
(()=>{
"use strict";
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
let W=0,H=0,cx=0,cy=0,Rg=0,DPR=Math.min(2,window.devicePixelRatio||1);
const MOBILE=matchMedia('(pointer:coarse)').matches||(navigator.maxTouchPoints>0&&Math.min(screen.width||1024,screen.height||768)<=820);
const FRAME_MS=MOBILE?33:0;                      // ~30fps cap on phones
let lastDraw=0, rafLive=true;

// ---------- audio (proven pipeline) ----------
let actx=null, analyser=null, srcNode=null, micStream=null;
let freqBytes=null, timeBytes=null, prevFreq=null, binHz=0;
let buf=null, bufNode=null, filePlaying=false, pauseOffset=0, startedAt=0;
let mode='idle';

function ensureCtx(){
  if(actx) return;
  actx=new (window.AudioContext||window.webkitAudioContext)();
  analyser=actx.createAnalyser();
  analyser.fftSize=4096; analyser.smoothingTimeConstant=0.6;
  freqBytes=new Uint8Array(analyser.frequencyBinCount);
  prevFreq=new Uint8Array(analyser.frequencyBinCount);
  timeBytes=new Uint8Array(analyser.fftSize);
  binHz=actx.sampleRate/analyser.fftSize;
}
function startBuf(){
  if(!buf) return;
  bufNode=actx.createBufferSource(); bufNode.buffer=buf; bufNode.loop=true;
  bufNode.connect(analyser); analyser.connect(actx.destination);
  bufNode.start(0, pauseOffset % buf.duration);
  startedAt=actx.currentTime; filePlaying=true;
}
function stopBuf(){
  if(bufNode){ try{bufNode.stop();}catch(e){} try{bufNode.disconnect();}catch(e){} bufNode=null; }
  if(filePlaying){ pauseOffset += actx.currentTime - startedAt; filePlaying=false; }
}
function disconnectSrc(){
  stopBuf();
  if(srcNode){ try{srcNode.disconnect();}catch(e){} srcNode=null; }
  if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
}
function decode(arr){
  return new Promise((res,rej)=>{
    let done=false; const ok=b=>{if(!done){done=true;res(b);}}, no=e=>{if(!done){done=true;rej(e||0);}};
    const p=actx.decodeAudioData(arr, ok, no); if(p&&p.then) p.then(ok,no);
  });
}
async function useFile(file){
  try{
    ensureCtx(); await actx.resume(); disconnectSrc(); mode='file';
    buf=await decode(await file.arrayBuffer()); pauseOffset=0; startBuf();
    reveal(); syncPlay();
  }catch(err){ console.error(err); alert('Could not decode "'+file.name+'".\nTry MP3, M4A/AAC, WAV, OGG, FLAC.'); }
}
function stopMic(){ disconnectSrc(); mode='idle'; syncPlay(); }
let micPending=false;
async function useMic(){
  if(micPending) return;                          // ignore clicks while the prompt is open
  if(mode==='mic'){ stopMic(); return; }          // second tap turns the mic off
  micPending=true;
  const vb=document.getElementById('vMic'), vTxt=vb.textContent;
  vb.textContent='Connecting\u2026';
  // request the mic FIRST, synchronously inside the tap gesture — iOS Safari can
  // drop the gesture (and the request) if an await runs before getUserMedia
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}); }
  catch(e){ micPending=false; vb.textContent=vTxt; mode='idle'; syncPlay(); alert('Mic unavailable — check browser permissions.'); return; }
  micPending=false; vb.textContent=vTxt;
  ensureCtx(); await actx.resume(); disconnectSrc();
  micStream=stream; mode='mic';
  srcNode=actx.createMediaStreamSource(micStream); srcNode.connect(analyser);
  reveal(); syncPlay();
}
async function useSample(){
  try{
    ensureCtx(); await actx.resume(); disconnectSrc(); mode='file';
    const r=await fetch('assets/sample-gong.mp3'); if(!r.ok) throw new Error('HTTP '+r.status);
    buf=await decode(await r.arrayBuffer()); pauseOffset=0; startBuf();
    reveal(); syncPlay();
  }catch(err){ console.error(err); alert('Could not load the sample gong.'); }
}
function syncPlay(){
  const playing = mode==='mic' || (mode==='file' && filePlaying);
  document.getElementById('dPlayIcon').setAttribute('d', playing?'M9 5v14M15 5v14':'M8 5v14l11-7z');
  document.getElementById('dMic').classList.toggle('active',mode==='mic');
}

// ---------- features ----------
const feat={level:0,centroid:600,low:0,mid:0,high:0,kick:0,prevLvl:0,bloom:0};
function analyze(){
  if(!analyser){ feat.level=0; feat.kick*=0.9; return; }
  analyser.getByteFrequencyData(freqBytes);
  analyser.getByteTimeDomainData(timeBytes);
  let s=0; for(let i=0;i<timeBytes.length;i++){const v=(timeBytes[i]-128)/128;s+=v*v;}
  const lvl=Math.sqrt(s/timeBytes.length);
  let num=0,den=0,low=0,mid=0,high=0,flux=0;
  const i0=Math.max(1,(30/binHz)|0), i1=Math.min(freqBytes.length,(8000/binHz)|0);
  const sLo=(250/binHz)|0, sHi=(2000/binHz)|0;
  for(let i=i0;i<i1;i++){
    const m=freqBytes[i]/255, f=i*binHz; num+=f*m; den+=m;
    if(i<sLo) low+=m; else if(i<sHi) mid+=m; else high+=m;
    const df=freqBytes[i]-prevFreq[i]; if(df>0) flux+=df;
  }
  prevFreq.set(freqBytes);
  flux/=(i1-i0)*255;                       // mean positive spectral change per bin
  const centroid = den>0.001 ? num/den : feat.centroid;
  // onset = level rise (clean strikes) OR spectral flux (strikes masked by a
  // still-decaying previous strike, which only ever loses spectral energy)
  const rise=lvl-feat.prevLvl;
  const onset=Math.max(rise*8, (flux-0.005)*55);
  if(onset>0.3 && lvl>0.05) feat.kick=Math.min(1.8,feat.kick+onset);
  feat.kick*=0.92; feat.prevLvl=feat.prevLvl*0.6+lvl*0.4;
  feat.level+=(lvl-feat.level)*0.22;
  feat.low+=(low*0.02-feat.low)*0.18; feat.mid+=(mid*0.012-feat.mid)*0.12; feat.high+=(high*0.01-feat.high)*0.2;
  feat.centroid+=(centroid-feat.centroid)*0.07;
  const bl=clamp((Math.log(feat.centroid)-Math.log(150))/(Math.log(4000)-Math.log(150)),0,1);
  feat.bloom+=(bl-feat.bloom)*0.06;
}

// ---------- star field: logarithmic spiral arms + halo scatter ----------
// star: u radius 0..1, ang base angle, sz px, tw twinkle phase, twSp speed,
//       col palette index, hero = bright star that gets a cross glint
const PAL=[
  [255,255,255],[196,214,255],[152,172,255],[178,142,255],
  [214,152,255],[126,142,236],[236,190,255]
];
const ARMS=9, PITCH=1.9;
const NSTARS=Math.min(screen.width||1024,screen.height||768)<=820?2600:4200;   // lighter on phones
let stars=[];
function gauss(){ return (Math.random()+Math.random()+Math.random())/1.5-1; }   // ~N(0,0.33)
function buildStars(){
  stars=[];
  for(let i=0;i<NSTARS;i++){
    const halo=Math.random()<0.16;                 // loose stars between the arms
    const u=Math.pow(Math.random(),0.72);          // denser toward the core
    let ang;
    if(halo){ ang=Math.random()*TAU; }
    else{
      const arm=(Math.random()*ARMS)|0;
      const scatter=gauss()*(0.05+0.11*u);         // arms widen with radius
      ang=arm*TAU/ARMS + PITCH*Math.log(0.06+u) + scatter;
    }
    const hero=Math.random()<0.02;
    stars.push({
      u, ang, halo,
      sz:(hero?1.9+Math.random()*1.4:0.5+Math.random()*1.1)*DPR,
      tw:Math.random()*TAU, twSp:0.8+Math.random()*2.6,
      base:halo?0.25+Math.random()*0.3:0.4+Math.random()*0.5,
      col:PAL[(Math.random()*PAL.length)|0], hero
    });
  }
}
buildStars();

// dust lanes: dark filaments hugging the trailing edge of each arm, rendered
// once to an offscreen canvas in pattern space and rotated with the galaxy
let dustC=null, dustS=0;
function buildDust(){
  dustS=Math.ceil(Rg*2.3)||2;
  dustC=document.createElement('canvas'); dustC.width=dustC.height=dustS;
  const d=dustC.getContext('2d'), c0=dustS/2;
  for(let arm=0;arm<ARMS;arm++){
    for(let k=0;k<70;k++){
      const p=k/69, u=0.14+p*0.92;
      const ang=arm*TAU/ARMS + PITCH*Math.log(0.06+u) + 0.24 + gauss()*0.03;
      const r=u*Rg, x=c0+Math.cos(ang)*r, y=c0+Math.sin(ang)*r;
      const s=Rg*(0.016+0.012*Math.random());
      const a=0.42*Math.sin(Math.PI*p)*(0.55+0.45*Math.random());
      const g2=d.createRadialGradient(x,y,0,x,y,s);
      g2.addColorStop(0,'rgba(4,3,12,'+a+')'); g2.addColorStop(1,'rgba(4,3,12,0)');
      d.fillStyle=g2; d.fillRect(x-s,y-s,s*2,s*2);
    }
  }
}

// ---------- render ----------
let rot=0, act=0, waves=[], last=0, coreEnv=0;
let comets=[], lastComet=-99;

function draw(t){
  if(document.hidden){ rafLive=false; return; }    // pause fully when backgrounded
  const liveNow=(mode==='mic')||(mode==='file'&&filePlaying);
  const gap=(!liveNow&&act<0.02)?125:FRAME_MS;     // idle -> ~8fps, mobile -> ~30fps
  if(gap&&t-lastDraw<gap){ requestAnimationFrame(draw); return; }
  lastDraw=t;
  const dt=Math.min(0.05,(t-last)/1000||0); last=t;
  const live=liveNow;
  act+=((live?1:0)-act)*0.02;

  const react=parseFloat(reactEl.value), spk=parseFloat(sparkleEl.value), spin=parseFloat(spinEl.value);
  // spin slider = RPM cap (max 2 RPM); audio sways within it, never past it
  const rotMax=spin*TAU/60;
  rot+=rotMax*(0.3+0.7*act)*(0.5+0.5*clamp(feat.mid,0,1))*dt;

  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#040308'; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  const breathe=1 + 0.07*feat.low*react;
  const rotNow=-rot;                               // rigid rotation: the pattern turns as one,
                                                   // counter-clockwise, arms trailing — no wind-up
  // pitch colour temperature: deep gong -> warm amber, bright shimmer -> cool blue-violet
  const wt=clamp(1-feat.bloom,0,1);
  const tR=148+107*wt, tG=168+40*wt, tB=255-115*wt;

  // ---- core: white heart flaring on strikes, tinted halo breathing with level ----
  coreEnv += (feat.kick*1.1+feat.level*0.3-coreEnv)*(feat.kick>coreEnv?0.5:0.03);
  const coreR=Rg*(0.16+0.10*clamp(coreEnv,0,1.4))*breathe;
  const cg1=ctx.createRadialGradient(cx,cy,0,cx,cy,coreR);
  cg1.addColorStop(0,'rgba(255,252,244,'+(0.55+0.4*clamp(coreEnv,0,1))+')');
  cg1.addColorStop(0.5,'rgba('+Math.round(216+(255-216)*wt*0.5)+','+Math.round(196-30*wt*0.5)+','+Math.round(255-90*wt*0.5)+','+(0.28+0.3*clamp(coreEnv,0,1))+')');
  cg1.addColorStop(1,'rgba(160,130,255,0)');
  ctx.fillStyle=cg1; ctx.fillRect(cx-coreR,cy-coreR,coreR*2,coreR*2);
  const haloR=Rg*(0.62+0.25*clamp(coreEnv,0,1.4));
  const hR=Math.round(150+(255-150)*wt*0.5), hG=Math.round(120+(190-120)*wt*0.5), hB=Math.round(255+(120-255)*wt*0.5);
  const cg2=ctx.createRadialGradient(cx,cy,0,cx,cy,haloR);
  cg2.addColorStop(0,'rgba('+hR+','+hG+','+hB+','+(0.10+0.14*feat.level*react)+')');
  cg2.addColorStop(1,'rgba('+Math.round(hR*0.6)+','+Math.round(hG*0.5)+','+Math.round(hB*0.8)+',0)');
  ctx.fillStyle=cg2; ctx.fillRect(cx-haloR,cy-haloR,haloR*2,haloR*2);

  // ---- strike waves: light rolling slowly outward along the arms ----
  if(feat.kick>0.3 && (!waves.length || waves[waves.length-1].r>Rg*0.18))
    waves.push({r:Rg*0.06, v:Rg*(0.45+0.25*feat.kick), life:1});
  for(let i=waves.length-1;i>=0;i--){
    const w=waves[i]; w.r+=w.v*dt; w.life-=dt*0.35;
    if(w.life<=0) waves.splice(i,1);
  }
  const band=Rg*0.11;

  // ---- stars ----
  const twGain=(0.25+feat.high*5.5)*spk;           // Sparkle owns the glitter
  const heroes=[];
  for(const st of stars){
    const rad=st.u*Rg*breathe, ang=st.ang+rotNow;
    const x=cx+Math.cos(ang)*rad, y=cy+Math.sin(ang)*rad;
    st.tw+=dt*st.twSp*(1+feat.high*5.5*spk);
    let a=st.base*(0.30+0.70*act)*(0.35+0.65*(0.5+0.5*Math.sin(st.tw))*clamp(twGain,0,1.6));
    if(!st.halo) for(const w of waves){            // the wave flows along the arms only
      const d=Math.abs(rad-w.r);
      if(d<band) a+=w.life*(1-d/band)*0.85;
    }
    if(a<=0.02) continue;
    a=clamp(a,0,1);
    const c=st.col;
    const r=(c[0]+(tR-c[0])*0.38)|0, g=(c[1]+(tG-c[1])*0.38)|0, b=(c[2]+(tB-c[2])*0.38)|0;
    ctx.fillStyle='rgba('+r+','+g+','+b+','+a+')';
    ctx.fillRect(x-st.sz/2,y-st.sz/2,st.sz,st.sz);
    if(st.hero && a>0.45) heroes.push({x,y,a,r,g,b,s:st.sz});
  }
  // cross glints on the brightest stars — the actual "sparkle"
  ctx.lineWidth=1*DPR;
  for(const h of heroes){
    const len=h.s*(2.6+3.3*feat.high*spk);
    ctx.strokeStyle='rgba('+h.r+','+h.g+','+h.b+','+(h.a*0.7)+')';
    ctx.beginPath();
    ctx.moveTo(h.x-len,h.y); ctx.lineTo(h.x+len,h.y);
    ctx.moveTo(h.x,h.y-len); ctx.lineTo(h.x,h.y+len);
    ctx.stroke();
  }

  // ---- dust lanes: dark filaments occluding the glow, riding the same rotation ----
  ctx.globalCompositeOperation='source-over';
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rotNow); ctx.scale(breathe,breathe);
  ctx.drawImage(dustC,-dustS/2,-dustS/2);
  ctx.restore();
  ctx.globalCompositeOperation='lighter';

  // ---- shooting stars: a streak across the field on the heaviest strikes ----
  if(feat.kick>1.0 && act>0.5 && t/1000-lastComet>6){
    lastComet=t/1000;
    const sa=Math.random()*TAU, sp=Rg*(0.75+0.4*Math.random());
    const ha=sa+Math.PI+(Math.random()-0.5)*0.9;
    comets.push({x:cx+Math.cos(sa)*Rg*0.95, y:cy+Math.sin(sa)*Rg*0.95,
                 vx:Math.cos(ha)*sp, vy:Math.sin(ha)*sp, life:1});
  }
  for(let i=comets.length-1;i>=0;i--){
    const cm=comets[i]; cm.x+=cm.vx*dt; cm.y+=cm.vy*dt; cm.life-=dt*0.32;
    if(cm.life<=0){ comets.splice(i,1); continue; }
    const tx=cm.x-cm.vx*0.25, ty=cm.y-cm.vy*0.25;
    const lg=ctx.createLinearGradient(tx,ty,cm.x,cm.y);
    lg.addColorStop(0,'rgba(255,240,214,0)');
    lg.addColorStop(1,'rgba(255,240,214,'+(0.9*cm.life)+')');
    ctx.strokeStyle=lg; ctx.lineWidth=2.2*DPR;
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(cm.x,cm.y); ctx.stroke();
    const hg=ctx.createRadialGradient(cm.x,cm.y,0,cm.x,cm.y,9*DPR);
    hg.addColorStop(0,'rgba(255,250,235,'+(0.95*cm.life)+')'); hg.addColorStop(1,'rgba(255,250,235,0)');
    ctx.fillStyle=hg; ctx.fillRect(cm.x-9*DPR,cm.y-9*DPR,18*DPR,18*DPR);
  }

  if(t-hudT>140){ updateHUD(); hudT=t; }
  requestAnimationFrame(draw);
}
let hudT=0;
function updateHUD(){
  hStars.textContent=NSTARS;
  hHz.textContent=Math.round(feat.centroid)+' Hz';
  hLvl.style.width=Math.min(100,feat.level*200)+'%';
}

function loopFeat(){ analyze(); setTimeout(loopFeat, document.hidden?250:1000/60); }

// ---------- layout ----------
function resize(){
  W=Math.floor(innerWidth*DPR); H=Math.floor(innerHeight*DPR);
  cvs.width=W; cvs.height=H; cx=W/2; cy=H/2; Rg=Math.min(W,H)*0.46;
  buildDust();
}
addEventListener('resize',resize);

// ---------- UI ----------
const reactEl=document.getElementById('react'), sparkleEl=document.getElementById('sparkle'), spinEl=document.getElementById('spin');
const hStars=document.getElementById('hStars'), hHz=document.getElementById('hHz'), hLvl=document.getElementById('hLvl');
const veil=document.getElementById('veil'), dock=document.getElementById('dock'), hud=document.getElementById('hud'), nav=document.getElementById('nav');
const filePick=document.getElementById('filePick');
function reveal(){ veil.classList.add('gone'); dock.classList.remove('hide'); hud.classList.remove('hide'); poke(); }

document.getElementById('vFile').onclick=()=>filePick.click();
document.getElementById('dFile').onclick=()=>filePick.click();
filePick.onchange=e=>{ if(e.target.files[0]) useFile(e.target.files[0]); };
document.getElementById('vMic').onclick=useMic;
document.getElementById('dMic').onclick=useMic;
document.getElementById('vSample').onclick=useSample;
document.getElementById('dSample').onclick=useSample;
document.getElementById('dPlay').onclick=()=>{ if(mode==='file'){ filePlaying?stopBuf():startBuf(); syncPlay(); } else if(mode==='mic'){ stopMic(); } else if(buf){ mode='file'; startBuf(); syncPlay(); } };
document.getElementById('dFull').onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); };

['dragover','drop'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
document.addEventListener('drop',e=>{ const f=[...e.dataTransfer.files].find(f=>f.type.startsWith('audio')); if(f) useFile(f); });

let hideTimer=null;
function poke(){
  dock.classList.remove('hide'); hud.classList.remove('hide'); nav.classList.remove('hide'); clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>{ if(mode==='mic'||(mode==='file'&&filePlaying)){ dock.classList.add('hide'); hud.classList.add('hide'); nav.classList.add('hide'); } },2800);
}
['mousemove','touchstart','keydown'].forEach(ev=>addEventListener(ev,poke));
['touchend','click'].forEach(ev=>addEventListener(ev,()=>{ if(actx&&actx.state==='suspended') actx.resume(); }));
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && !rafLive){ rafLive=true; last=performance.now(); lastDraw=0; requestAnimationFrame(draw); }
});

// go
resize(); loopFeat(); requestAnimationFrame(draw);
})();
</script>
</body>
