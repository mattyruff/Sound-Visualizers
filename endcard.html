<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resonance</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#040605;color:#e9dcc0;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem}
  body::before{content:"";position:fixed;inset:0;z-index:-1;
    background:radial-gradient(60% 50% at 50% 42%,#13100640 0%,#040605 70%)}
  .glyph{width:72px;height:72px;opacity:.9;animation:spin 36s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-weight:300;font-size:2.2rem;letter-spacing:.4em;text-transform:uppercase;color:#ffe9a8;padding-left:.4em}
  p.tag{color:#8a7f63;font-size:.95rem;letter-spacing:.08em}
  p.url{color:#f5c542;font-size:1.05rem;letter-spacing:.12em;margin-top:.6rem}
  p.modes{color:#8a7f63;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;margin-top:1rem}
</style>
</head>
<body>
  <svg class="glyph" viewBox="0 0 64 64" fill="none" stroke="#f5c542" stroke-width="1.2">
    <circle cx="32" cy="32" r="11"/><circle cx="32" cy="21" r="11"/><circle cx="32" cy="43" r="11"/>
    <circle cx="22.5" cy="26.5" r="11"/><circle cx="41.5" cy="26.5" r="11"/>
    <circle cx="22.5" cy="37.5" r="11"/><circle cx="41.5" cy="37.5" r="11"/>
  </svg>
  <h1>Resonance</h1>
  <p class="tag">Sound healing you can see.</p>
  <p class="url">mattyruff.github.io/Sound-Visualizers</p>
  <p class="modes">Play a recording &nbsp;·&nbsp; Load your own &nbsp;·&nbsp; Go live with your gong</p>
</body>
</html>
